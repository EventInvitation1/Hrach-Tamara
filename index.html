<!DOCTYPE html>
<html lang="hy">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Հրաչ & Թամարա — Save the Date</title>
    
    <style>
        /* ---------------------------------------------------------------------
           0. FONTS & ROOT CSS VARIABLES
        --------------------------------------------------------------------- */
        @font-face {
            font-family: 'UR Dzeragir';
            src: url('Dzeragir-Handdrawn.otf') format('opentype');
            font-weight: normal;
            font-style: normal;
        }

        /* NEW CUSTOM FONT FOR BOTTOM SECTION */
        @font-face {
            font-family: 'Poqrik';
            src: url('poqrik.ttf') format('truetype');
            font-weight: normal;
            font-style: normal;
        }

        :root {
            /* Palette */
            --bg-color: #EAE7DC;
            --text-color: #554F43;
            --olive-color: #6a774c;
            
            /* Depth & Photorealistic Layering Shadows */
            --shadow-paper-layered: 0 12px 24px -6px rgba(0, 0, 0, 0.18), 0 4px 10px -2px rgba(0, 0, 0, 0.10);
            --shadow-vinyl: 0 8px 18px rgba(0, 0, 0, 0.28);
            --filter-drop-shadow: drop-shadow(0 6px 12px rgba(0, 0, 0, 0.16));
            --filter-envelope-shadow: drop-shadow(0 10px 22px rgba(0, 0, 0, 0.14));

            /* Rotations */
            --angle-polaroid-left: -6deg;
            --angle-polaroid-right: 4deg;
        }

        /* ---------------------------------------------------------------------
           1. CORE RESETS & FULL-SCREEN CENTERING
        --------------------------------------------------------------------- */
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body, html {
            width: 100%;
            height: 100%;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            
            /* Initial state handles centering */
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;

            -webkit-font-smoothing: antialiased;
            -moz-osx-font-smoothing: grayscale;
            text-rendering: optimizeLegibility;
        }

        /* Lock scrolling before envelope is opened */
        body.lock-scroll {
            overflow: hidden;
            height: 100vh;
            height: 100dvh;
        }

        /* Unlocked state to allow scrolling down */
        body.unlocked {
            overflow-y: auto;
            overflow-x: hidden;
            justify-content: flex-start; /* Aligns content to top so we can scroll down */
        }

        img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;
            image-rendering: -webkit-optimize-contrast;
            transform: translateZ(0);
            backface-visibility: hidden;
        }

        /* ---------------------------------------------------------------------
           2. STATE 1: INITIAL INTRO OVERLAY
        --------------------------------------------------------------------- */
        #intro-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: var(--bg-color);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            z-index: 100;
            pointer-events: auto;
            transition: opacity 0.4s ease, visibility 0.4s ease;
            padding-bottom: 8vh; 
        }

        .instruction-text {
            position: absolute;
            top: 10vh;
            left: 50%;
            transform: translateX(-50%);
            font-family: "Didot", "Playfair Display", "Optima", "Helvetica Neue", sans-serif;
            font-size: 1.2rem;
            font-weight: 300; 
            letter-spacing: 2px;
            color: var(--text-color);
            text-align: center;
            width: 90%;
            white-space: nowrap;
            user-select: none;
        }

        .envelope-closed-wrapper {
            cursor: pointer;
            width: 65%; 
            max-width: 220px; 
            aspect-ratio: 5 / 3.6;
            -webkit-tap-highlight-color: transparent;
            animation: envelopeSlideIn 1.2s cubic-bezier(0.25, 1, 0.5, 1) forwards;
        }

        .envelope-closed-wrapper img {
            filter: var(--filter-envelope-shadow);
            transition: transform 0.2s ease;
        }

        .envelope-closed-wrapper:active img {
            transform: scale(0.96);
        }

        @keyframes envelopeSlideIn {
            0% { transform: translateY(5vh); opacity: 0; }
            100% { transform: translateY(0); opacity: 1; }
        }

        .stage-transition #intro-overlay {
            pointer-events: none;
            opacity: 0;
            visibility: hidden;
        }

        /* ---------------------------------------------------------------------
           3. THE CANVAS (Top Hero Section)
        --------------------------------------------------------------------- */
        #top-hero-wrapper {
            width: 100%;
            height: 100vh;
            height: 100dvh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            flex-shrink: 0; 
        }

        #composition-canvas {
            position: relative;
            width: 92vw;
            max-width: 400px;
            aspect-ratio: 3 / 5.2; 
            display: none;
            margin-bottom: 10vh; 
        }

        .stage-transition #composition-canvas {
            display: block;
        }

        #opened-envelope-container {
            position: absolute;
            top: 2%; 
            left: 50%;
            width: 70%; 
            z-index: 1;
            transform: translateX(-50%) scale(0.8);
            opacity: 0;
            display: flex;
            justify-content: center;
        }

        .stage-transition #opened-envelope-container {
            animation: openAndZoom 0.7s cubic-bezier(0.34, 1.2, 0.64, 1) forwards;
        }

        #opened-envelope-container img {
            width: 100%;
            height: auto;
            object-fit: contain;
            filter: var(--filter-envelope-shadow);
        }

        @keyframes openAndZoom {
            0% { transform: translateX(-50%) scale(0.8); opacity: 0; }
            100% { transform: translateX(-50%) scale(1); opacity: 1; }
        }

        /* ---------------------------------------------------------------------
           4. TIGHT COLLAGE COMPOSITION 
        --------------------------------------------------------------------- */
        .save-the-date-card {
            position: absolute;
            top: 28%; 
            right: 8%; 
            width: 45%; 
            aspect-ratio: 1 / 1.5;
            z-index: 3;
            opacity: 0;
            background: #ffffff;
            box-shadow: var(--shadow-paper-layered);
            border-radius: 2px;
            padding: 3px;
        }
        .reveal-content .save-the-date-card {
            animation: cascadeIn 0.7s cubic-bezier(0.215, 0.610, 0.355, 1) 0.1s forwards;
        }

        .vinyl-accent-wrapper {
            position: absolute;
            top: 34%; 
            left: 6%;
            width: 40%; 
            aspect-ratio: 1 / 1;
            border-radius: 50%;
            z-index: 2;
            opacity: 0;
            box-shadow: var(--shadow-vinyl);
            background: #111111;
            overflow: hidden;
        }
        .vinyl-accent-wrapper img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            border-radius: 50%;
        }
        .reveal-content .vinyl-accent-wrapper {
            animation: cascadeIn 0.7s cubic-bezier(0.215, 0.610, 0.355, 1) 0.3s forwards;
        }
        .reveal-content .vinyl-accent-wrapper img {
            animation: continuousRotation 16s linear 1.0s infinite;
        }

        .accent-sticker-wrapper {
            position: absolute;
            top: 50%; 
            left: 36%;
            width: 28%; 
            aspect-ratio: 1 / 1.35;
            z-index: 20;
            opacity: 0;
            filter: var(--filter-drop-shadow);
        }
        .reveal-content .accent-sticker-wrapper {
            animation: stickerPop 0.6s cubic-bezier(0.34, 1.5, 0.64, 1) 0.9s forwards;
        }

        .polaroid-vertical {
            position: absolute;
            top: 64%; 
            left: 5%;
            width: 45%;
            aspect-ratio: 3 / 3.9;
            background: #ffffff;
            padding: 5px 5px 18px 5px;
            box-shadow: var(--shadow-paper-layered);
            transform: rotate(0deg); 
            z-index: 10;
            opacity: 0;
        }
        .reveal-content .polaroid-vertical {
            animation: cascadeInPolaroidLeft 0.8s cubic-bezier(0.175, 0.885, 0.32, 1.12) 0.5s forwards;
        }

        .polaroid-horizontal {
            position: absolute;
            top: 71%; 
            right: 4%;
            width: 52%;
            aspect-ratio: 4 / 3.2;
            background: #ffffff;
            padding: 5px 5px 14px 5px;
            box-shadow: var(--shadow-paper-layered);
            transform: rotate(0deg);
            z-index: 11;
            opacity: 0;
        }
        .reveal-content .polaroid-horizontal {
            animation: cascadeInPolaroidRight 0.8s cubic-bezier(0.175, 0.885, 0.32, 1.12) 0.7s forwards;
        }

        .flower-accent {
            position: absolute;
            pointer-events: none;
            opacity: 0;
            filter: var(--filter-drop-shadow);
        }
        .card-flower {
            top: -12px;
            right: -12px;
            width: 35%;
            height: auto;
            z-index: 12;
        }
        .vinyl-flower {
            top: 59%; 
            left: 8%;
            width: 22%;
            height: auto;
            z-index: 15;
        }
        .reveal-content .flower-accent {
            animation: flowerPop 0.6s cubic-bezier(0.34, 1.5, 0.64, 1) 1.1s forwards;
        }

        @keyframes cascadeIn {
            0% { opacity: 0; transform: translateY(16px); }
            100% { opacity: 1; transform: translateY(0); }
        }
        @keyframes cascadeInPolaroidLeft {
            0% { opacity: 0; transform: translateY(22px) rotate(0deg); }
            100% { opacity: 1; transform: translateY(0) rotate(var(--angle-polaroid-left)); }
        }
        @keyframes cascadeInPolaroidRight {
            0% { opacity: 0; transform: translateY(22px) rotate(0deg); }
            100% { opacity: 1; transform: translateY(0) rotate(var(--angle-polaroid-right)); }
        }
        @keyframes stickerPop {
            0% { opacity: 0; transform: scale(0.4); }
            100% { opacity: 1; transform: scale(1); }
        }
        @keyframes flowerPop {
            0% { opacity: 0; transform: scale(0.6); }
            100% { opacity: 1; transform: scale(1); }
        }
        @keyframes continuousRotation {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        /* ---------------------------------------------------------------------
           5. NEW WEDDING DETAILS & COUNTDOWN SECTION
        --------------------------------------------------------------------- */
        
        .wedding-details-section {
            width: 100%;
            display: none; 
            flex-direction: column;
        }

        .reveal-content .wedding-details-section {
            display: flex;
        }

        /* Custom Font Application */
        .elegant-font {
            font-family: 'Poqrik', sans-serif;
            font-weight: 300; /* Thinned out */
            letter-spacing: 0.5px;
            text-align: center;
            margin: 0;
            text-transform: none; /* Strictly remove uppercase */
        }

        /* Top Beige Container - Compact Spacing */
        .invitation-container {
            background-color: var(--bg-color);
            padding: 35px 20px; /* Drastically reduced vertical padding */
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
        }

        .invitation-container h2 {
            font-size: 1.6rem; /* Reduced size */
            color: var(--text-color);
            margin-bottom: 12px; /* Tighter gap */
        }

        .invitation-container p {
            font-size: 0.95rem; /* Reduced size */
            color: var(--text-color);
            line-height: 1.4; /* Tighter line-height */
            max-width: 90%;
        }

        /* Bottom Olive Green Container - Compact Spacing */
        .countdown-container {
            background-color: var(--olive-color); 
            padding: 30px 15px 40px 15px; /* Drastically reduced padding */
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
        }

        .countdown-container h2 {
            color: var(--bg-color);
            font-size: 1.4rem; /* Reduced size */
            margin-bottom: 20px; /* Tighter gap */
        }

        /* Countdown UI - Single Row Fix */
        .timer-wrapper {
            display: flex;
            gap: 8px; /* Tighter spacing */
            justify-content: center;
            flex-wrap: nowrap; /* Forces a single row, strictly no wrapping */
            width: 100%;
            max-width: 360px; /* Caps the maximum width to keep it compact */
        }

        .timer-box {
            background-color: #ffffff;
            border-radius: 6px;
            flex: 1; /* Allows boxes to share available space equally */
            height: 60px; /* Shorter box */
            max-width: 65px; /* Ensures they don't get too wide on larger screens */
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.15); 
        }

        .timer-number {
            font-size: 1.25rem; /* Smaller numbers to fit */
            color: var(--olive-color); 
            font-weight: 300; 
            margin-bottom: 0px; 
            line-height: 1.2;
        }

        .timer-label {
            font-size: 0.65rem; /* Smaller text label */
            color: var(--olive-color); 
        }
    </style>
</head>
<body class="lock-scroll">

    <!-- STATE 1: INITIAL INTRO OVERLAY -->
    <div id="intro-overlay">
        <h2 class="instruction-text">Սեղմեք՝ բացելու համար</h2>
        
        <div class="envelope-closed-wrapper" id="envelopeBtn" role="button" aria-label="Բացել հրավիրատոմսը">
            <img src="front.png" alt="Closed Envelope">
        </div>
    </div>

    <!-- WRAPPER to keep original canvas centered 100vh -->
    <div id="top-hero-wrapper">
        <!-- MAIN CENTERING VIEWPORT STAGE -->
        <div id="composition-canvas">

            <div id="opened-envelope-container">
                <img src="opened2.png" alt="Open Envelope">
            </div>
                
            <div class="save-the-date-card">
                <img src="Save-the-date.png" alt="Hrach & Tamara - Save the Date Details">
                <img src="flower.png" alt="Floral Accent Top Right" class="flower-accent card-flower">
            </div>

            <div class="vinyl-accent-wrapper">
                <img src="vinyl.png" alt="Rotating Decorative Vinyl">
            </div>

            <img src="flower.png" alt="Floral Accent Vinyl Pin" class="flower-accent vinyl-flower">

            <div class="polaroid-vertical">
                <img src="vertical.jpeg" alt="Couple Moment Vertical">
            </div>

            <div class="polaroid-horizontal">
                <img src="horizontal.jpeg" alt="Hrach and Tamara Profile Picture">
            </div>

            <div class="accent-sticker-wrapper">
                <img src="sticker.png" alt="Floral Initials Monogram Seal">
            </div>

        </div>
    </div>

    <!-- NEW SECTION: Wedding Details & Countdown -->
    <section class="wedding-details-section">
      
        <!-- Top Beige Container -->
        <div class="invitation-container">
            <h2 class="elegant-font">Հարգելի՛ հյուրեր</h2>
            <p class="elegant-font">Այս տարվա օրերից մեկը մեզ համար առանձնահատուկ է լինելու, և մենք ցանկանում ենք այն անցկացնել մեր հարազատների ու ընկերների շրջապատում: Մեծ սիրով հրավիրում ենք ձեզ ամենահուզիչ տոնին՝ մեր հարսանիքին:</p>
        </div>
      
        <!-- Bottom Olive Green Container -->
        <div class="countdown-container">
            <h2 class="elegant-font">Հարսանիքին մնացել է</h2>
            
            <div class="timer-wrapper">
                <div class="timer-box">
                    <span id="cd-days" class="timer-number elegant-font">00</span>
                    <span class="timer-label elegant-font">Օր</span>
                </div>
                <div class="timer-box">
                    <span id="cd-hours" class="timer-number elegant-font">00</span>
                    <span class="timer-label elegant-font">Ժամ</span>
                </div>
                <div class="timer-box">
                    <span id="cd-minutes" class="timer-number elegant-font">00</span>
                    <span class="timer-label elegant-font">Րոպե</span>
                </div>
                <div class="timer-box">
                    <span id="cd-seconds" class="timer-number elegant-font">00</span>
                    <span class="timer-label elegant-font">Վայրկյան</span>
                </div>
            </div>
        </div>
        
    </section>

    <!-- INTERACTION & COUNTDOWN LOGIC -->
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const envelopeBtn = document.getElementById('envelopeBtn');
            const body = document.body;

            // 1. Envelope Opening & Scroll Unlock
            envelopeBtn.addEventListener('click', () => {
                body.classList.add('stage-transition');
                
                // Remove scroll lock and allow natural document flow
                body.classList.remove('lock-scroll');
                body.classList.add('unlocked');
                
                setTimeout(() => {
                    body.classList.add('reveal-content');
                }, 350); 
            });

            // 2. Countdown Timer Initialization
            const targetDate = new Date("September 13, 2026 00:00:00").getTime();

            const updateCountdown = setInterval(() => {
                const now = new Date().getTime();
                const timeRemaining = targetDate - now;

                if (timeRemaining < 0) {
                    clearInterval(updateCountdown);
                    document.getElementById("cd-days").innerText = "00";
                    document.getElementById("cd-hours").innerText = "00";
                    document.getElementById("cd-minutes").innerText = "00";
                    document.getElementById("cd-seconds").innerText = "00";
                    return;
                }

                const days = Math.floor(timeRemaining / (1000 * 60 * 60 * 24));
                const hours = Math.floor((timeRemaining % (1000 * 60 * 60 * 24)) / (1000 * 60 * 60));
                const minutes = Math.floor((timeRemaining % (1000 * 60 * 60)) / (1000 * 60));
                const seconds = Math.floor((timeRemaining % (1000 * 60)) / 1000);

                // Pad single digits with a leading zero
                document.getElementById("cd-days").innerText = days.toString().padStart(2, '0');
                document.getElementById("cd-hours").innerText = hours.toString().padStart(2, '0');
                document.getElementById("cd-minutes").innerText = minutes.toString().padStart(2, '0');
                document.getElementById("cd-seconds").innerText = seconds.toString().padStart(2, '0');
                
            }, 1000); 
        });
    </script>
</body>
</html>
